name: Build

on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
            - ready_for_review
        paths-ignore:
            - "**.md"
    workflow_dispatch:
        inputs:
            build_android:
                description: "Build Android"
                required: false
                default: true
                type: boolean

            build_ios:
                description: "Build iOS"
                required: false
                default: true
                type: boolean

            build_mac:
                description: "Build Mac"
                required: false
                default: true
                type: boolean

            build_win_x64:
                description: "Build Win-x64"
                required: false
                default: true
                type: boolean

            build_linux_x64:
                description: "Build Linux-x64"
                required: false
                default: true
                type: boolean

            tag:
                description: "tag"
                required: false
                default: ""
                type: string

jobs:
    android:
        if: ${{ (github.event_name == 'pull_request' && github.repository == 'bggRGjQaUbCoE/PiliPlus') || github.event.inputs.build_android == 'true' }}
        name: Release Android
        runs-on: ubuntu-latest
        permissions: write-all

        steps:
            - name: 代码迁出
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: 构建Java环境
              uses: actions/setup-java@v5
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"
                  cache-dependency-path: |
                      android/*.gradle*
                      android/**/gradle-wrapper.properties

            - name: 安装Flutter
              uses: subosito/flutter-action@v2
              id: flutter-action
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Apply Patch
              shell: pwsh
              run: lib/scripts/patch.ps1 android

            - name: Write key
              if: github.event_name == 'workflow_dispatch'
              run: |
                  if [ ! -z "${{ secrets.SIGN_KEYSTORE_BASE64 }}" ]; then
                    echo "${{ secrets.SIGN_KEYSTORE_BASE64 }}" | base64 --decode > android/app/key.jks
                    echo storeFile='key.jks' >> android/key.properties
                    echo storePassword='${{ secrets.KEYSTORE_PASSWORD }}' >> android/key.properties
                    echo keyAlias='${{ secrets.KEY_ALIAS }}' >> android/key.properties
                    echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> android/key.properties
                  fi

            - name: Set and Extract version
              if: ${{ github.event_name == 'workflow_dispatch' }}
              shell: pwsh
              run: lib/scripts/build.ps1 android

            - name: Flutter Build Release Apk
              if: ${{ github.event_name == 'workflow_dispatch' }}
              run: flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --pub

            - name: Flutter Build Dev Apk
              if: ${{ github.event_name == 'pull_request' }}
              run: |
                  flutter build apk --release --split-per-abi --android-project-arg dev=1 --pub

            - name: Rename
              run: |
                  for file in build/app/outputs/flutter-apk/app-*-release.apk; do
                    abi=$(echo "$file" | sed -E 's|.*app-(.*)-release\.apk|\1|')
                    mv "$file" "BilibiliPro_android_${{ env.version }}_${abi}.apk"
                  done
              shell: bash

            - name: Release
              if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ github.event.inputs.tag }}
                  name: ${{ github.event.inputs.tag }}
                  files: BilibiliPro_android_*.apk

            - name: 上传
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_arm64-v8a
                  path: BilibiliPro_android_*_arm64-v8a.apk

            - name: 上传
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_armeabi-v7a
                  path: BilibiliPro_android_*_armeabi-v7a.apk

            - name: 上传
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_x86_64
                  path: BilibiliPro_android_*_x86_64.apk

    ios:
        if: ${{ (github.event_name == 'pull_request' && github.repository == 'bggRGjQaUbCoE/PiliPlus') || github.event.inputs.build_ios == 'true' }}
        uses: ./.github/workflows/ios.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    mac:
        if: ${{ github.event.inputs.build_mac == 'true' }}
        uses: ./.github/workflows/mac.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    win_x64:
        if: ${{ (github.event_name == 'pull_request' && github.repository == 'bggRGjQaUbCoE/PiliPlus') || github.event.inputs.build_win_x64 == 'true' }}
        uses: ./.github/workflows/win_x64.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    linux_x64:
        if: ${{ github.event.inputs.build_linux_x64 == 'true' }}
        uses: ./.github/workflows/linux_x64.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    release_changelog:
        if: "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}"
        name: Update release changelog
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Check out release history
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Generate changelog from patch differences
              id: changelog
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.event.inputs.tag }}
              run: |
                  set -euo pipefail

                  for _ in $(seq 1 120); do
                    if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                      break
                    fi
                    sleep 30
                  done
                  gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

                  git fetch --force --tags origin
                  current_commit=$(git rev-parse "${TAG}^{commit}")
                  current_tree=$(git rev-parse "${current_commit}^{tree}")
                  previous_tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | jq -r --arg tag "$TAG" \
                    "[.[] | select(.draft == false and .tag_name != \$tag)] | sort_by(.created_at) | last | .tag_name // empty")

                  notes="$RUNNER_TEMP/release-notes.md"
                  if [[ -z "$previous_tag" ]]; then
                    printf '%s\n' 'No previous release is available.' > "$notes"
                  else
                    previous_commit=$(git rev-parse "${previous_tag}^{commit}")
                    previous_tree=$(git rev-parse "${previous_commit}^{tree}")
                    test -n "$current_tree"
                    test -n "$previous_tree"

                    git cherry "$previous_commit" "$current_commit" | while read -r status commit; do
                      [[ "$status" == '+' ]] || continue
                      subject=$(git log -1 --format=%s "$commit")
                      printf -- "- [\`%.7s\`](%s/%s/commit/%s) %s\n" \
                        "$commit" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$commit" "$subject"
                    done > "$notes"

                    if [[ ! -s "$notes" ]]; then
                      printf '%s\n' 'No patch differences from the previous release.' > "$notes"
                    fi
                  fi

                  echo "notes=$notes" >> "$GITHUB_OUTPUT"

            - name: Update release notes
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.event.inputs.tag }}
                  NOTES: ${{ steps.changelog.outputs.notes }}
              run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$NOTES"
